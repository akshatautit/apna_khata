services:
  - type: web
    name: apna-khata-backend
    runtime: node
    branch: current-app
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    region: singapore
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: apna-khata-frontend
    runtime: static
    branch: current-app
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://apna-khata-backend.onrender.com